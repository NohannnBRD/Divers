<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Un resto, ça te dit ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page: #fff5f6; 
    --accent: #ff4d6d;  
    --accent-hover: #e03755;
    --text-main: #2b2d42; 
    --text-muted: #8d99ae;
    --card-bg: rgba(255, 255, 255, 0.85);
    --card-border: rgba(255, 255, 255, 0.9);
    --glow: rgba(255, 77, 109, 0.25);
  }
  *{box-sizing:border-box;}
  
  html, body{
    margin:0; padding:0; min-height:100%;
    background: var(--bg-page);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
  }
  body{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 16px 8px; 
  }
  
  /* Correction des calques d'arrière-plan */
  .bokeh{
    position:fixed; border-radius:50%;
    filter: blur(60px);
    pointer-events:none;
    z-index: 1; /* Rendu positif pour ne pas passer sous le body */
  }
  .bokeh.b1{ width:300px; height:300px; background:#ffb3c1; top:0%; left:5%; opacity:0.6;}
  .bokeh.b2{ width:250px; height:250px; background:#a2d2ff; bottom:5%; right:5%; opacity:0.5;}
  .bokeh.b3{ width:200px; height:200px; background:#ffc8dd; bottom:20%; left:15%; opacity:0.5;}

  #floating-emojis {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2; /* Juste au-dessus du bokeh */
    overflow: hidden;
    transition: opacity 0.5s ease;
  }
  .floating-emoji {
    position: absolute;
    bottom: -60px;
    opacity: 0.35; 
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    to {
      transform: translateY(-120vh) rotate(360deg);
    }
  }

  .stage{
    position:relative;
    width:min(100%, 480px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 10; /* La carte est forcée au tout premier plan */
  }

  .card{
    position:relative;
    width:100%;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1.5px solid var(--card-border);
    border-radius: 28px;
    box-shadow: 0 15px 35px rgba(43, 45, 66, 0.06);
    text-align:center;
    padding: 24px 16px; 
  }

  .eyebrow{
    font-size:12px;
    font-weight: 600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    opacity:0.9;
    margin-bottom:10px;
  }

  h1{
    font-family:'Outfit', sans-serif;
    font-weight:700;
    font-size:clamp(24px, 5vw, 34px);
    line-height:1.2;
    margin:0 0 28px 0;
    color:var(--text-main);
  }
  
  h1 em{
    font-style:normal;
    position: relative;
    display: inline-block;
    z-index: 1;
  }
  h1 em::after{
    content: '';
    position: absolute;
    bottom: 3px; left: -2%;
    width: 104%; height: 10px;
    background: #ffb3c1;
    z-index: -1;
    border-radius: 4px;
    opacity: 0.6;
    transform: rotate(-1deg);
  }

  .choice-zone{
    position:relative;
    width:100%;
    height:130px;
  }

  .btn{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    border:none;
    border-radius:999px;
    padding:14px 36px;
    font-family:'Outfit', sans-serif;
    font-weight:600;
    font-size:17px;
    cursor:pointer;
    transition: top 0.35s cubic-bezier(.2,.9,.3,1.3), left 0.35s cubic-bezier(.2,.9,.3,1.3), transform 0.35s cubic-bezier(.2,.9,.3,1.3), box-shadow 0.25s ease, background 0.2s ease;
  }

  #btnOui{
    background: var(--accent);
    color: white;
    box-shadow: 0 8px 20px var(--glow);
    top:0;
    z-index: 10;
  }
  #btnOui:hover{
    background: var(--accent-hover);
    box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4);
    transform:translateX(-50%) translateY(-2px);
  }

  #btnNon{
    background: white;
    color: var(--text-muted);
    border: 2px solid #edf2f4;
    top:58px;
    z-index: 5;
  }

  .panel{
    display:none;
    width:100%;
    animation: rise 0.4s cubic-bezier(.2,.8,.2,1);
  }
  .panel.active{ display:block; }
  @keyframes rise{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .panel h2{
    font-family:'Outfit', sans-serif;
    font-weight:700;
    font-size:20px;
    margin: 0 0 16px 0;
    color:var(--text-main);
  }

  .cal-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .cal-header button{
    background:none; border:none; color:var(--text-main);
    font-size:20px; cursor:pointer; padding:2px 10px;
    border-radius:8px;
  }
  .cal-header button:hover{ background: rgba(0,0,0,0.04); }
  .cal-month{ font-family:'Outfit', sans-serif; font-weight:600; font-size:16px; }

  .cal-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:4px;
    margin-bottom:8px;
  }
  .cal-dow{
    font-size:11px; font-weight:600; color:var(--text-muted); text-align:center; padding-bottom:2px;
    text-transform:uppercase;
  }
  .cal-day{
    aspect-ratio:1;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    font-size:13px; font-weight:500;
    cursor:pointer;
    color:var(--text-main);
    background: rgba(255,255,255,0.6);
    border: 1px solid transparent;
    transition: all 0.15s ease;
  }
  .cal-day.disabled{
    color: #d8e2dc;
    cursor:default;
    background:transparent;
  }
  .cal-day.empty{ visibility:hidden; }
  .cal-day:not(.disabled):not(.empty):hover{
    background: white;
    border-color: #ffe5ec;
  }
  .cal-day.selected{
    background: var(--accent);
    color:white;
    font-weight:600;
    border-color: var(--accent);
    box-shadow: 0 3px 8px var(--glow);
  }

  .chip-container{
    display:flex; gap:6px; flex-wrap:wrap;
    justify-content:center;
    margin: 14px 0 20px 0;
  }
  .chip{
    padding:8px 14px;
    border-radius:999px;
    border:1.5px solid #edf2f4;
    background:white;
    color:var(--text-main);
    font-size:13px; font-weight:500;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .chip:hover{ border-color:var(--accent-hover); color:var(--accent); }
  .chip.selected{
    background: var(--accent);
    color:white;
    border-color: var(--accent);
    font-weight:600;
    box-shadow: 0 3px 8px var(--glow);
  }

  .confirm-btn{
    width:100%;
    border:none;
    border-radius:999px;
    padding:14px;
    font-family:'Outfit', sans-serif;
    font-weight:600;
    font-size:15px;
    color:white;
    background: var(--accent);
    cursor:pointer;
    box-shadow: 0 6px 18px var(--glow);
    transition: all 0.2s ease;
  }
  .confirm-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
    box-shadow:none;
  }
  .confirm-btn:not(:disabled):hover{ 
    background: var(--accent-hover);
  }

  .success{
    text-align:center;
    padding: 10px 0;
  }
  .success .glass{
    font-size:48px;
    margin-bottom:8px;
    display:block;
  }
  .success p{
    color:var(--text-muted);
    font-size:14px;
    line-height:1.5;
  }
  .success .recap{
    color:var(--accent);
    font-weight:600;
  }

  .status-msg{
    margin-top:10px;
    font-size:11px;
    color:var(--text-muted);
    min-height:14px;
  }

  @media (prefers-reduced-motion: reduce){
    .btn, .panel{ transition:none; animation:none; }
  }
</style>
</head>
<body>

<!-- Effet bokeh (taches de couleur) -->
<div class="bokeh b1"></div>
<div class="bokeh b2"></div>
<div class="bokeh b3"></div>

<!-- Conteneur pour les émojis flottants -->
<div id="floating-emojis"></div>

<div class="stage">
  <div class="card">

    <!-- Panel 1 : la question -->
    <div id="panelQuestion" class="panel active">
      <div class="eyebrow">Une petite faim ? 😋</div>
      <h1>Est-ce que ça te dirait<br>qu'on se fasse <em>un resto</em> ?</h1>

      <div class="choice-zone" id="choiceZone">
        <button id="btnOui" class="btn">Grave !</button>
        <button id="btnNon" class="btn">Non</button>
      </div>
    </div>

    <!-- Panel 2 : Choix de la cuisine -->
    <div id="panelFood" class="panel">
      <h2>Qu'est-ce qui te ferait plaisir ?</h2>
      <div class="chip-container" id="foodRow">
        <button class="chip food-chip" data-food="Italien 🍕">🍕 Italien</button>
        <button class="chip food-chip" data-food="Asiatique 🍣">🍣 Asiatique</button>
        <button class="chip food-chip" data-food="Burger 🍔">🍔 Burger</button>
        <button class="chip food-chip" data-food="Traditionnel 🍷">🍷 Traditionnel</button>
        <button class="chip food-chip" data-food="Surprise 🙈">🙈 Surprise</button>
      </div>
      <button class="confirm-btn" id="nextToCalBtn" disabled>Suivant</button>
    </div>

    <!-- Panel 3 : calendrier -->
    <div id="panelCalendar" class="panel">
      <h2>Choisis un moment qui t'arrange</h2>

      <div class="cal-header">
        <button id="prevMonth" aria-label="Mois précédent">‹</button>
        <div class="cal-month" id="calMonthLabel"></div>
        <button id="nextMonth" aria-label="Mois suivant">›</button>
      </div>

      <div class="cal-grid" id="calDow"></div>
      <div class="cal-grid" id="calGrid"></div>

      <div class="chip-container" id="timeRow">
        <button class="chip time-chip" data-time="12:00">12h00</button>
        <button class="chip time-chip" data-time="12:30">12h30</button>
        <button class="chip time-chip" data-time="13:00">13h00</button>
        <button class="chip time-chip" data-time="13:30">13h30</button>
        <button class="chip time-chip" data-time="18:30">18h30</button>
        <button class="chip time-chip" data-time="19:00">19h00</button>
        <button class="chip time-chip" data-time="19:30">19h30</button>
        <button class="chip time-chip" data-time="20:00">20h00</button>
        <button class="chip time-chip" data-time="20:30">20h30</button>
        <button class="chip time-chip" data-time="21:00">21h00</button>
        <button class="chip time-chip" data-time="21:30">21h30</button>
      </div>

      <button class="confirm-btn" id="confirmBtn" disabled>Confirmer ça !</button>
      <div class="status-msg" id="statusMsg">&nbsp;</div>
    </div>

    <!-- Panel 4 : succès -->
    <div id="panelSuccess" class="panel">
      <div class="success">
        <span class="glass">🍽️</span>
        <h2>C'est noté !</h2>
        <p>On se fait ça <span class="recap" id="recap"></span>.<br>À très vite !</p>
      </div>
    </div>

  </div>
</div>

<script>
  // ============================================================
  // URL de ton Cloudflare Worker
  // ============================================================
  const WORKER_URL = "https://invitation-webhook.nohan-brochard0-629.workers.dev/";

  // ---------- Génération des émojis de fond ----------
  function createFloatingEmojis() {
    const container = document.getElementById('floating-emojis');
    const emojis = ['🍹', '🍕', '🍣', '🍔', '🍷', '🙈'];
    const emojiCount = 25; 

    for (let i = 0; i < emojiCount; i++) {
      const emojiSpan = document.createElement('span');
      emojiSpan.className = 'floating-emoji';
      emojiSpan.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      
      emojiSpan.style.left = Math.random() * 100 + 'vw';
      emojiSpan.style.fontSize = (Math.random() * 20 + 20) + 'px'; 
      emojiSpan.style.animationDuration = (Math.random() * 15 + 10) + 's'; 
      emojiSpan.style.animationDelay = (Math.random() * -25) + 's'; 
      
      container.appendChild(emojiSpan);
    }
  }
  createFloatingEmojis(); 

  // ---------- Bouton "Non" fuyant ----------
  const zone = document.getElementById('choiceZone');
  const btnNon = document.getElementById('btnNon');
  const btnOui = document.getElementById('btnOui');
  
  let compteurNon = 0;

  function fleeButton(){
    compteurNon++; 

    const zoneRect = zone.getBoundingClientRect();
    const btnRect = btnNon.getBoundingClientRect();
    const ouiRect = btnOui.getBoundingClientRect();

    const maxLeft = zoneRect.width - btnRect.width;
    const maxTop = zoneRect.height - btnRect.height;

    const padding = 12;
    const ouiLeft = (ouiRect.left - zoneRect.left) - padding;
    const ouiTop = (ouiRect.top - zoneRect.top) - padding;
    const ouiRight = (ouiRect.right - zoneRect.left) + padding;
    const ouiBottom = (ouiRect.bottom - zoneRect.top) + padding;

    let newLeft, newTop;
    let overlap = true;
    let attempts = 0;

    while (overlap && attempts < 100) {
      newLeft = Math.max(6, Math.min(maxLeft - 6, Math.random() * maxLeft));
      newTop = Math.max(0, Math.min(maxTop, Math.random() * maxTop));

      const nonRight = newLeft + btnRect.width;
      const nonBottom = newTop + btnRect.height;

      if (newLeft < ouiRight && nonRight > ouiLeft && newTop < ouiBottom && nonBottom > ouiTop) {
        overlap = true; 
      } else {
        overlap = false; 
      }
      attempts++;
    }

    btnNon.style.left = newLeft + 'px';
    btnNon.style.top = newTop + 'px';
    btnNon.style.transform = 'none';
  }

  zone.addEventListener('mousemove', (e) => {
    const btnRect = btnNon.getBoundingClientRect();
    const cx = btnRect.left + btnRect.width / 2;
    const cy = btnRect.top + btnRect.height / 2;
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    if (dist < 80) fleeButton();
  });

  btnNon.addEventListener('touchstart', (e) => {
    e.preventDefault();
    fleeButton();
  }, { passive: false });

  btnNon.addEventListener('click', (e) => {
    e.preventDefault();
    fleeButton();
  });

  // ---------- Navigation entre les panels ----------
  const panelQuestion = document.getElementById('panelQuestion');
  const panelFood = document.getElementById('panelFood');
  const panelCalendar = document.getElementById('panelCalendar');
  const panelSuccess = document.getElementById('panelSuccess');

  btnOui.addEventListener('click', () => {
    panelQuestion.classList.remove('active');
    panelFood.classList.add('active');
    
    // Fait disparaître doucement les émojis flottants
    document.getElementById('floating-emojis').style.opacity = '0';
  });

  // ---------- Choix de la nourriture ----------
  let selectedFood = null;
  const nextToCalBtn = document.getElementById('nextToCalBtn');

  document.querySelectorAll('.food-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.food-chip.selected').forEach(el => el.classList.remove('selected'));
      chip.classList.add('selected');
      selectedFood = chip.dataset.food;
      nextToCalBtn.disabled = false;
    });
  });

  nextToCalBtn.addEventListener('click', () => {
    panelFood.classList.remove('active');
    panelCalendar.classList.add('active');
    renderCalendar();
  });

  // ---------- Calendrier ----------
  const dowLabels = ['Lu','Ma','Me','Je','Ve','Sa','Di'];
  const monthLabels = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

  let today = new Date();
  today.setHours(0,0,0,0);
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let selectedDate = null;
  let selectedTime = null;

  const calDow = document.getElementById('calDow');
  const calGrid = document.getElementById('calGrid');
  const calMonthLabel = document.getElementById('calMonthLabel');
  const confirmBtn = document.getElementById('confirmBtn');
  const statusMsg = document.getElementById('statusMsg');

  dowLabels.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    calDow.appendChild(el);
  });

  function renderCalendar(){
    calMonthLabel.textContent = `${monthLabels[viewMonth]} ${viewYear}`;
    calGrid.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1);
    let startOffset = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for (let i = 0; i < startOffset; i++){
      const empty = document.createElement('div');
      empty.className = 'cal-day empty';
      calGrid.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++){
      const cell = document.createElement('div');
      const cellDate = new Date(viewYear, viewMonth, day);
      const isPast = cellDate < today;

      cell.className = 'cal-day' + (isPast ? ' disabled' : '');
      cell.textContent = day;

      if (!isPast){
        cell.addEventListener('click', () => {
          document.querySelectorAll('.cal-day.selected').forEach(el => el.classList.remove('selected'));
          cell.classList.add('selected');
          selectedDate = cellDate;
          updateConfirmState();
        });
      }

      if (selectedDate && cellDate.getTime() === selectedDate.getTime()){
        cell.classList.add('selected');
      }

      calGrid.appendChild(cell);
    }
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0){ viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11){ viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  document.querySelectorAll('.time-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.time-chip.selected').forEach(el => el.classList.remove('selected'));
      chip.classList.add('selected');
      selectedTime = chip.dataset.time;
      updateConfirmState();
    });
  });

  function updateConfirmState(){
    confirmBtn.disabled = !(selectedDate && selectedTime);
  }

  function formatDateFr(d){
    return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  // ---------- Animation Confettis ----------
  function startConfetti() {
    const canvas = document.createElement('canvas');
    canvas.style.position = 'fixed';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.pointerEvents = 'none';
    canvas.style.zIndex = '9999';
    document.body.appendChild(canvas);
    
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    const colors = ['#ff4d6d', '#ffb3c1', '#a2d2ff', '#ffc8dd', '#ffd166'];
    
    for(let i=0; i<120; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            w: Math.random() * 8 + 4,
            h: Math.random() * 4 + 4,
            c: colors[Math.floor(Math.random() * colors.length)],
            vy: Math.random() * 3 + 2,
            vx: Math.random() * 2 - 1,
            rot: Math.random() * 360,
            rs: Math.random() * 4 - 2
        });
    }

    function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        
        particles.forEach(p => {
            p.y += p.vy;
            p.x += p.vx;
            p.rot += p.rs;
            if (p.y < canvas.height) active = true;
            
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot * Math.PI / 180);
            ctx.fillStyle = p.c;
            ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
            ctx.restore();
        });
        
        if(active) {
          requestAnimationFrame(update);
        } else {
          canvas.remove();
        }
    }
    update();
  }

  // ---------- Envoi du Webhook ----------
  confirmBtn.addEventListener('click', async () => {
    if (!selectedDate || !selectedTime) return;

    confirmBtn.disabled = true;
    statusMsg.textContent = 'Envoi en cours…';

    const dateLabel = formatDateFr(selectedDate);
    
    let message = `🍽️ Elle a dit **oui** pour un resto **${selectedFood}** ! Vous y allez le **${dateLabel}** à **${selectedTime}**.`;
    
    if (compteurNon > 0) {
      message += `\n\n*(PS : Elle a quand même essayé de cliquer sur "Non" **${compteurNon}** fois avant d'accepter... 🤭)*`;
    }

    if (!WORKER_URL || WORKER_URL.includes('COLLE_ICI')) {
      statusMsg.textContent = "Worker non configuré.";
      confirmBtn.disabled = false;
      return;
    }

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: message })
      });

      if (!res.ok) throw new Error('Le serveur a répondu avec le statut ' + res.status);

      panelCalendar.classList.remove('active');
      panelSuccess.classList.add('active');
      document.getElementById('recap').textContent = `le ${dateLabel} à ${selectedTime}`;
      
      startConfetti();
      
    } catch (err) {
      statusMsg.textContent = "Erreur : " + err.message;
      confirmBtn.disabled = false;
    }
  });
</script>

</body>
</html>

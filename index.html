<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Balises pour cacher la surprise lors du partage du lien -->
  <title>J'ai une question pour toi...</title>
  <meta property="og:title" content="J'ai une petite question...">
  <meta property="og:description" content="Ouvre le lien pour voir de quoi il s'agit 👀">
  <meta name="theme-color" content="#fff5f6">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-page: #fff5f6;
      --accent: #ff4d6d;
      --accent-hover: #e03755;
      --text-main: #2b2d42;
      --text-muted: #8d99ae;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.9);
      --glow: rgba(255, 77, 109, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 8px;
    }

    .bokeh {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      z-index: 1;
    }

    .bokeh.b1 {
      width: 300px;
      height: 300px;
      background: #ffb3c1;
      top: 0%;
      left: 5%;
      opacity: 0.6;
    }

    .bokeh.b2 {
      width: 250px;
      height: 250px;
      background: #a2d2ff;
      bottom: 5%;
      right: 5%;
      opacity: 0.5;
    }

    .bokeh.b3 {
      width: 200px;
      height: 200px;
      background: #ffc8dd;
      bottom: 20%;
      left: 15%;
      opacity: 0.5;
    }

    #floating-emojis {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
      transition: opacity 0.5s ease;
    }

    .floating-emoji {
      position: absolute;
      bottom: -60px;
      opacity: 0.35;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-120vh) rotate(360deg);
      }
    }

    .stage {
      position: relative;
      width: min(100%, 480px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .card {
      position: relative;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--card-border);
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(43, 45, 66, 0.06);
      text-align: center;
      padding: 32px 16px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.9;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: clamp(24px, 5vw, 34px);
      line-height: 1.2;
      margin: 0 0 28px 0;
      color: var(--text-main);
    }

    h1 em {
      font-style: normal;
      position: relative;
      display: inline-block;
      z-index: 1;
    }

    h1 em::after {
      content: '';
      position: absolute;
      bottom: 3px;
      left: -2%;
      width: 104%;
      height: 10px;
      background: #ffb3c1;
      z-index: -1;
      border-radius: 4px;
      opacity: 0.6;
      transform: rotate(-1deg);
    }

    .choice-zone {
      position: relative;
      width: 100%;
      height: 130px;
    }

    .btn {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border: none;
      border-radius: 999px;
      padding: 14px 36px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 17px;
      cursor: pointer;
      transition: top 0.35s cubic-bezier(.2, .9, .3, 1.3), left 0.35s cubic-bezier(.2, .9, .3, 1.3), transform 0.35s cubic-bezier(.2, .9, .3, 1.3), box-shadow 0.25s ease, background 0.2s ease;
    }

    #btnOui {
      background: var(--accent);
      color: white;
      box-shadow: 0 8px 20px var(--glow);
      top: 0;
      z-index: 10;
    }

    #btnOui:hover {
      background: var(--accent-hover);
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4);
      transform: translateX(-50%) translateY(-2px);
    }

    #btnOui:disabled {
      background: var(--accent-hover);
      opacity: 0.8;
      cursor: not-allowed;
      transform: translateX(-50%);
    }

    #btnNon {
      background: white;
      color: var(--text-muted);
      border: 2px solid #edf2f4;
      top: 58px;
      z-index: 5;
    }

    .panel {
      display: none;
      width: 100%;
      animation: rise 0.4s cubic-bezier(.2, .8, .2, 1);
    }

    .panel.active {
      display: block;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel h2 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 24px;
      margin: 0 0 12px 0;
      color: var(--text-main);
    }

    .success {
      text-align: center;
      padding: 10px 0;
    }

    .success .glass {
      font-size: 52px;
      margin-bottom: 16px;
      display: block;
    }

    /* Style pour le GIF de validation */
    .success-gif {
      max-width: 220px;
      width: 100%;
      height: auto;
      border-radius: 16px;
      margin: 8px 0 20px 0;
      box-shadow: 0 10px 25px rgba(43, 45, 66, 0.08);
    }

    .success p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin: 0;
    }

    .success .recap {
      color: var(--accent);
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {

      .btn,
      .panel {
        transition: none;
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- Effet bokeh (taches de couleur) -->
  <div class="bokeh b1"></div>
  <div class="bokeh b2"></div>
  <div class="bokeh b3"></div>

  <!-- Conteneur pour les émojis flottants -->
  <div id="floating-emojis"></div>

  <div class="stage">
    <div class="card">

      <!-- Panel 1 : la question -->
      <div id="panelQuestion" class="panel active">
        <div class="eyebrow">Une petite faim ? 😋</div>
        <h1>Est-ce que ça te dirait<br>qu'on se fasse <em>un resto</em> ?</h1>

        <div class="choice-zone" id="choiceZone">
          <button id="btnOui" class="btn">Grave !</button>
          <button id="btnNon" class="btn">Non</button>
        </div>
      </div>

      <!-- Panel 2 : succès -->
      <div id="panelSuccess" class="panel">
        <div class="success">
          <span class="glass">🍽️</span>
          <h2>Impec !</h2>
          <!-- Intégration du GIF -->
          <img src="https://i.imgflip.com/aydodj.gif" alt="Célébration" class="success-gif">
          <p>On voit ça ensemble pour <span class="recap">la date et le lieu</span>.<br>À très vite !</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ============================================================
    // URL de ton Cloudflare Worker
    // ============================================================
    const WORKER_URL = "https://invitation-webhook.nohan-brochard0-629.workers.dev/";

    // ---------- Génération des émojis de fond ----------
    function createFloatingEmojis() {
      const container = document.getElementById('floating-emojis');
      const emojis = ['🍹', '🍕', '🍣', '🍔', '🍷', '🙈'];
      const emojiCount = 25;

      for (let i = 0; i < emojiCount; i++) {
        const emojiSpan = document.createElement('span');
        emojiSpan.className = 'floating-emoji';
        emojiSpan.textContent = emojis[Math.floor(Math.random() * emojis.length)];

        emojiSpan.style.left = Math.random() * 100 + 'vw';
        emojiSpan.style.fontSize = (Math.random() * 20 + 20) + 'px';
        emojiSpan.style.animationDuration = (Math.random() * 15 + 10) + 's';
        emojiSpan.style.animationDelay = (Math.random() * -25) + 's';

        container.appendChild(emojiSpan);
      }
    }
    createFloatingEmojis();

    // ---------- Bouton "Non" fuyant ----------
    const btnNon = document.getElementById('btnNon');
    const btnOui = document.getElementById('btnOui');

    let compteurNon = 0;
    let lastFleeTime = 0; // Cooldown de sensibilité

    function fleeButton() {
      const now = Date.now();
      // Le bouton ne peut fuir qu'une fois toutes les 350 millisecondes max
      if (now - lastFleeTime < 350) return;
      lastFleeTime = now;

      compteurNon++;

      // ASTUCE : On sort le bouton de la carte pour le rattacher au body (tout l'écran)
      if (btnNon.parentNode !== document.body) {
        document.body.appendChild(btnNon);
        btnNon.style.position = 'fixed';
        btnNon.style.zIndex = '9999'; // Toujours par-dessus le reste
        btnNon.style.margin = '0';
      }

      const btnRect = btnNon.getBoundingClientRect();
      const ouiRect = btnOui.getBoundingClientRect();

      // Limites de l'écran
      const maxLeft = window.innerWidth - btnRect.width;
      const maxTop = window.innerHeight - btnRect.height;

      // Définition de la zone d'esquive (autour du bouton Oui)
      const padding = 15;
      const ouiLeft = ouiRect.left - padding;
      const ouiTop = ouiRect.top - padding;
      const ouiRight = ouiRect.right + padding;
      const ouiBottom = ouiRect.bottom + padding;

      let newLeft, newTop;
      let overlap = true;
      let attempts = 0;

      // On cherche une place sur l'écran qui ne chevauche pas le bouton "Oui"
      while (overlap && attempts < 100) {
        // Math.max/min empêche le bouton de sortir complètement de l'écran
        newLeft = Math.max(15, Math.min(maxLeft - 15, Math.random() * maxLeft));
        newTop = Math.max(15, Math.min(maxTop - 15, Math.random() * maxTop));

        const nonRight = newLeft + btnRect.width;
        const nonBottom = newTop + btnRect.height;

        if (newLeft < ouiRight && nonRight > ouiLeft && newTop < ouiBottom && nonBottom > ouiTop) {
          overlap = true; // On a touché la zone "Oui", on recalcule
        } else {
          overlap = false; // La place est bonne !
        }
        attempts++;
      }

      btnNon.style.left = newLeft + 'px';
      btnNon.style.top = newTop + 'px';
      btnNon.style.transform = 'none';
    }

    // On écoute la souris sur l'intégralité de la page
    document.addEventListener('mousemove', (e) => {
      if (document.getElementById('panelQuestion').classList.contains('active')) {
        const btnRect = btnNon.getBoundingClientRect();
        const cx = btnRect.left + btnRect.width / 2;
        const cy = btnRect.top + btnRect.height / 2;
        const dist = Math.hypot(e.clientX - cx, e.clientY - cy);

        if (dist < 80) fleeButton();
      }
    });

    btnNon.addEventListener('touchstart', (e) => {
      e.preventDefault();
      fleeButton();
    }, { passive: false });

    btnNon.addEventListener('click', (e) => {
      e.preventDefault();
      fleeButton();
    });

    // ---------- Animation Confettis ----------
    function startConfetti() {
      const canvas = document.createElement('canvas');
      canvas.style.position = 'fixed';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = '9999';
      document.body.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#ff4d6d', '#ffb3c1', '#a2d2ff', '#ffc8dd', '#ffd166'];

      for (let i = 0; i < 120; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: Math.random() * 8 + 4,
          h: Math.random() * 4 + 4,
          c: colors[Math.floor(Math.random() * colors.length)],
          vy: Math.random() * 3 + 2,
          vx: Math.random() * 2 - 1,
          rot: Math.random() * 360,
          rs: Math.random() * 4 - 2
        });
      }

      function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          p.y += p.vy;
          p.x += p.vx;
          p.rot += p.rs;
          if (p.y < canvas.height) active = true;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });

        if (active) {
          requestAnimationFrame(update);
        } else {
          canvas.remove();
        }
      }
      update();
    }

    // ---------- Bouton OUI / Envoi Webhook en Embed ----------
    const panelQuestion = document.getElementById('panelQuestion');
    const panelSuccess = document.getElementById('panelSuccess');

    btnOui.addEventListener('click', async () => {
      btnOui.disabled = true;
      const originalText = btnOui.textContent;
      btnOui.textContent = "Un instant...";

      // 1. Masquer le bouton "Non" s'il se baladait sur l'écran
      btnNon.style.display = 'none';

      let embedData = {
        title: "🍽️ Elle a dit OUI pour le resto !",
        description: "Prépare-toi à en discuter avec elle en privé pour fixer la date et le lieu.",
        color: 16731501
      };

      if (compteurNon > 0) {
        embedData.footer = {
          text: `PS : Elle a quand même essayé de cliquer sur "Non" ${compteurNon} fois avant d'accepter... 🤭`
        };
      }

      const payload = {
        content: "✨ Nouvelle réponse pour le resto !",
        embeds: [embedData]
      };

      if (!WORKER_URL || WORKER_URL.includes('COLLE_ICI')) {
        alert("Erreur : Le lien du Worker Cloudflare n'est pas configuré.");
        btnOui.disabled = false;
        btnOui.textContent = originalText;
        return;
      }

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errorText = await res.text();
          throw new Error(`Code ${res.status} : ${errorText}`);
        }

        document.getElementById('floating-emojis').style.opacity = '0';
        panelQuestion.classList.remove('active');
        panelSuccess.classList.add('active');
        startConfetti();

      } catch (err) {
        alert("Oups, l'envoi a échoué.\n\nDétail de l'erreur : " + err.message + "\n\n(N'hésite pas à m'envoyer ce message si tu es bloqué !)");
        btnOui.disabled = false;
        btnOui.textContent = originalText;

        // On réaffiche le bouton Non en cas d'erreur
        btnNon.style.display = 'block';
      }
    });

  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Un verre, ce soir ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #241226;
    --bg-panel: #34193a;
    --gold: #d3a24c;
    --gold-soft: #e8c98a;
    --rose: #e6a9ac;
    --cream: #f6ecdf;
    --muted: #b39ea9;
    --glow: rgba(211,162,76,0.35);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 30% 20%, #3a1f40 0%, var(--bg-deep) 55%, #170a1a 100%);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  body{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  /* ambient glass-light bokeh */
  .bokeh{
    position:absolute; border-radius:50%;
    filter: blur(40px);
    opacity:0.35;
    pointer-events:none;
  }
  .bokeh.b1{ width:280px; height:280px; background:var(--gold); top:8%; left:10%; opacity:0.18;}
  .bokeh.b2{ width:220px; height:220px; background:var(--rose); bottom:10%; right:8%; opacity:0.16;}
  .bokeh.b3{ width:160px; height:160px; background:var(--gold-soft); bottom:25%; left:20%; opacity:0.1;}

  .stage{
    position:relative;
    width:min(92vw, 560px);
    min-height:520px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .card{
    position:relative;
    width:100%;
    text-align:center;
    padding: 20px;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold-soft);
    opacity:0.8;
    margin-bottom:18px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(28px, 5.4vw, 44px);
    line-height:1.25;
    margin:0 0 42px 0;
    color:var(--cream);
    text-shadow: 0 0 30px var(--glow);
  }
  h1 em{
    font-style:italic;
    color:var(--gold-soft);
  }

  .choice-zone{
    position:relative;
    width:100%;
    height:150px;
  }

  .btn{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    border:none;
    border-radius:999px;
    padding:16px 40px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    transition: top 0.35s cubic-bezier(.2,.9,.3,1.3), left 0.35s cubic-bezier(.2,.9,.3,1.3), transform 0.35s cubic-bezier(.2,.9,.3,1.3), box-shadow 0.25s ease;
  }

  #btnOui{
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#2a1710;
    box-shadow: 0 8px 24px rgba(211,162,76,0.35);
    top:0;
    z-index: 10;
  }
  #btnOui:hover{
    box-shadow: 0 10px 30px rgba(211,162,76,0.5);
    transform:translateX(-50%) translateY(-2px);
  }

  #btnNon{
    background: transparent;
    color: var(--muted);
    border: 1.5px solid rgba(179,158,169,0.5);
    top:66px;
    z-index: 5;
  }

  .hint{
    margin-top:60px;
    font-size:13px;
    color:var(--muted);
    min-height:18px;
    letter-spacing:0.02em;
    font-style:italic;
    opacity:0.85;
    transition: opacity 0.3s ease;
  }

  /* ---- Panels ---- */
  .panel{
    display:none;
    width:100%;
    animation: rise 0.5s cubic-bezier(.2,.8,.2,1);
  }
  .panel.active{ display:block; }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .panel h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:26px;
    margin: 0 0 22px 0;
    color:var(--gold-soft);
  }

  .cal-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .cal-header button{
    background:none; border:none; color:var(--cream);
    font-size:18px; cursor:pointer; padding:6px 12px;
    border-radius:8px;
  }
  .cal-header button:hover{ background: rgba(255,255,255,0.06); }
  .cal-month{ font-weight:600; letter-spacing:0.03em; }

  .cal-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:6px;
    margin-bottom:10px;
  }
  .cal-dow{
    font-size:11px; color:var(--muted); text-align:center; padding-bottom:4px;
    text-transform:uppercase; letter-spacing:0.05em;
  }
  .cal-day{
    aspect-ratio:1;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    font-size:14px;
    cursor:pointer;
    color:var(--cream);
    background: rgba(255,255,255,0.03);
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .cal-day.disabled{
    color: rgba(179,158,169,0.3);
    cursor:default;
    background:transparent;
  }
  .cal-day.empty{ visibility:hidden; }
  .cal-day:not(.disabled):not(.empty):hover{
    background: rgba(211,162,76,0.2);
  }
  .cal-day.selected{
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#2a1710;
    font-weight:600;
    transform:scale(1.05);
  }

  .time-row{
    display:flex; gap:8px; flex-wrap:wrap;
    justify-content:center;
    margin: 18px 0 24px 0;
  }
  .time-chip{
    padding:8px 16px;
    border-radius:999px;
    border:1.5px solid rgba(179,158,169,0.4);
    background:transparent;
    color:var(--cream);
    font-size:13px;
    cursor:pointer;
    transition: all 0.2s ease;
  }
  .time-chip:hover{ border-color:var(--gold-soft); }
  .time-chip.selected{
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#2a1710;
    border-color: transparent;
    font-weight:600;
  }

  .confirm-btn{
    width:100%;
    border:none;
    border-radius:999px;
    padding:15px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:15px;
    color:#2a1710;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    cursor:pointer;
    box-shadow: 0 8px 24px rgba(211,162,76,0.35);
    transition: opacity 0.2s ease, transform 0.15s ease;
  }
  .confirm-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
    box-shadow:none;
  }
  .confirm-btn:not(:disabled):hover{ transform:translateY(-1px); }

  .back-link{
    display:block;
    text-align:center;
    margin-top:16px;
    font-size:12px;
    color:var(--muted);
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .success{
    text-align:center;
  }
  .success .glass{
    font-size:44px;
    margin-bottom:18px;
    display:block;
  }
  .success p{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
  }
  .success .recap{
    color:var(--gold-soft);
    font-weight:600;
  }

  .status-msg{
    margin-top:14px;
    font-size:12px;
    color:var(--muted);
    min-height:16px;
  }

  @media (prefers-reduced-motion: reduce){
    .btn, .panel{ transition:none; animation:none; }
  }
</style>
</head>
<body>

<div class="bokeh b1"></div>
<div class="bokeh b2"></div>
<div class="bokeh b3"></div>

<div class="stage">
  <div class="card">

    <!-- Panel 1 : la question -->
    <div id="panelQuestion" class="panel active">
      <div class="eyebrow">Une question, comme ça</div>
      <h1>Est-ce que ça te dirait<br>que je t'invite <em>à boire un verre</em> ?</h1>

      <div class="choice-zone" id="choiceZone">
        <button id="btnOui" class="btn">Oui</button>
        <button id="btnNon" class="btn">Non</button>
      </div>

    </div>

    <!-- Panel 2 : calendrier -->
    <div id="panelCalendar" class="panel">
      <h2>Choisis un moment qui t'arrange</h2>

      <div class="cal-header">
        <button id="prevMonth" aria-label="Mois précédent">‹</button>
        <div class="cal-month" id="calMonthLabel"></div>
        <button id="nextMonth" aria-label="Mois suivant">›</button>
      </div>

      <div class="cal-grid" id="calDow"></div>
      <div class="cal-grid" id="calGrid"></div>

      <div class="time-row" id="timeRow">
        <button class="time-chip" data-time="18:00">18h00</button>
        <button class="time-chip" data-time="19:00">19h00</button>
        <button class="time-chip" data-time="20:00">20h00</button>
        <button class="time-chip" data-time="21:00">21h00</button>
      </div>

      <button class="confirm-btn" id="confirmBtn" disabled>Confirmer le rendez-vous</button>
      <div class="status-msg" id="statusMsg">&nbsp;</div>
    </div>

    <!-- Panel 3 : succès -->
    <div id="panelSuccess" class="panel">
      <div class="success">
        <span class="glass">🥂</span>
        <h2>C'est noté !</h2>
        <p>Rendez-vous <span class="recap" id="recap"></span>.<br>À très vite.</p>
      </div>
    </div>

  </div>
</div>

<script>
  // ============================================================
  // URL de ton Cloudflare Worker (relais sécurisé).
  // L'URL du webhook Discord elle-même reste secrète côté serveur.
  // ============================================================
  const WORKER_URL = "https://invitation-webhook.nohan-brochard0-629.workers.dev/";

  // ---------- Bouton "Non" fuyant ----------
  const zone = document.getElementById('choiceZone');
  const btnNon = document.getElementById('btnNon');
  const btnOui = document.getElementById('btnOui');
  
  let compteurNon = 0; // Ajout du compteur

  function fleeButton(){
    compteurNon++; // On incrémente à chaque tentative

    const zoneRect = zone.getBoundingClientRect();
    const btnRect = btnNon.getBoundingClientRect();
    const ouiRect = btnOui.getBoundingClientRect();

    const maxLeft = zoneRect.width - btnRect.width;
    const maxTop = zoneRect.height - btnRect.height;

    // Calcul de la zone interdite (bouton Oui + petite marge de sécurité de 15px)
    const padding = 15;
    const ouiLeft = (ouiRect.left - zoneRect.left) - padding;
    const ouiTop = (ouiRect.top - zoneRect.top) - padding;
    const ouiRight = (ouiRect.right - zoneRect.left) + padding;
    const ouiBottom = (ouiRect.bottom - zoneRect.top) + padding;

    let newLeft, newTop;
    let overlap = true;
    let attempts = 0;

    // On boucle tant que la nouvelle position chevauche le bouton Oui 
    // (avec une limite de 100 tentatives pour éviter un plantage)
    while (overlap && attempts < 100) {
      newLeft = Math.max(8, Math.min(maxLeft - 8, Math.random() * maxLeft));
      newTop = Math.max(0, Math.min(maxTop, Math.random() * maxTop));

      const nonRight = newLeft + btnRect.width;
      const nonBottom = newTop + btnRect.height;

      // Détection de collision (est-ce que le bouton Non est au-dessus du bouton Oui ?)
      if (newLeft < ouiRight && nonRight > ouiLeft && newTop < ouiBottom && nonBottom > ouiTop) {
        overlap = true; // Ça se chevauche, on recommence
      } else {
        overlap = false; // La place est libre !
      }
      attempts++;
    }

    btnNon.style.left = newLeft + 'px';
    btnNon.style.top = newTop + 'px';
    btnNon.style.transform = 'none';
  }

  // Desktop : le bouton fuit quand la souris s'approche
  zone.addEventListener('mousemove', (e) => {
    const btnRect = btnNon.getBoundingClientRect();
    const cx = btnRect.left + btnRect.width / 2;
    const cy = btnRect.top + btnRect.height / 2;
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    if (dist < 90) fleeButton();
  });

  // Mobile : le bouton fuit dès le premier contact, avant que le tap ne s'enregistre
  btnNon.addEventListener('touchstart', (e) => {
    e.preventDefault();
    fleeButton();
  }, { passive: false });

  // Sécurité : même en cas de clic improbable, on ne fait rien
  btnNon.addEventListener('click', (e) => {
    e.preventDefault();
    fleeButton();
  });

  // ---------- Passage au calendrier ----------
  const panelQuestion = document.getElementById('panelQuestion');
  const panelCalendar = document.getElementById('panelCalendar');
  const panelSuccess = document.getElementById('panelSuccess');

  btnOui.addEventListener('click', () => {
    panelQuestion.classList.remove('active');
    panelCalendar.classList.add('active');
    renderCalendar();
  });

  // ---------- Calendrier ----------
  const dowLabels = ['Lu','Ma','Me','Je','Ve','Sa','Di'];
  const monthLabels = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

  let today = new Date();
  today.setHours(0,0,0,0);
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let selectedDate = null;
  let selectedTime = null;

  const calDow = document.getElementById('calDow');
  const calGrid = document.getElementById('calGrid');
  const calMonthLabel = document.getElementById('calMonthLabel');
  const confirmBtn = document.getElementById('confirmBtn');
  const statusMsg = document.getElementById('statusMsg');

  dowLabels.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    calDow.appendChild(el);
  });

  function renderCalendar(){
    calMonthLabel.textContent = `${monthLabels[viewMonth]} ${viewYear}`;
    calGrid.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1);
    // Lundi = 0
    let startOffset = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for (let i = 0; i < startOffset; i++){
      const empty = document.createElement('div');
      empty.className = 'cal-day empty';
      calGrid.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++){
      const cell = document.createElement('div');
      const cellDate = new Date(viewYear, viewMonth, day);
      const isPast = cellDate < today;

      cell.className = 'cal-day' + (isPast ? ' disabled' : '');
      cell.textContent = day;

      if (!isPast){
        cell.addEventListener('click', () => {
          document.querySelectorAll('.cal-day.selected').forEach(el => el.classList.remove('selected'));
          cell.classList.add('selected');
          selectedDate = cellDate;
          updateConfirmState();
        });
      }

      if (selectedDate && cellDate.getTime() === selectedDate.getTime()){
        cell.classList.add('selected');
      }

      calGrid.appendChild(cell);
    }
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0){ viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11){ viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  document.querySelectorAll('.time-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.time-chip.selected').forEach(el => el.classList.remove('selected'));
      chip.classList.add('selected');
      selectedTime = chip.dataset.time;
      updateConfirmState();
    });
  });

  function updateConfirmState(){
    confirmBtn.disabled = !(selectedDate && selectedTime);
  }

  function formatDateFr(d){
    return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  confirmBtn.addEventListener('click', async () => {
    if (!selectedDate || !selectedTime) return;

    confirmBtn.disabled = true;
    statusMsg.textContent = 'Envoi en cours…';

    const dateLabel = formatDateFr(selectedDate);
    
    // Modification du message avec le compteur de clics "Non"
    let message = `🥂 Elle a dit **oui** ! Rendez-vous le **${dateLabel}** à **${selectedTime}**.`;
    
    if (compteurNon > 0) {
      message += `\n\n*(PS : Elle a quand même essayé de cliquer sur "Non" **${compteurNon}** fois avant d'accepter... 🤭)*`;
    }

    if (!WORKER_URL || WORKER_URL.includes('COLLE_ICI')) {
      statusMsg.textContent = "Worker non configuré — le rendez-vous n'a pas été envoyé.";
      confirmBtn.disabled = false;
      return;
    }

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: message })
      });

      if (!res.ok) throw new Error('Le serveur a répondu avec le statut ' + res.status);

      panelCalendar.classList.remove('active');
      panelSuccess.classList.add('active');
      document.getElementById('recap').textContent = `le ${dateLabel} à ${selectedTime}`;
    } catch (err) {
      statusMsg.textContent = "Erreur : " + err.message + " | URL appelée : " + WORKER_URL;
      confirmBtn.disabled = false;
    }
  });
</script>

</body>
</html>

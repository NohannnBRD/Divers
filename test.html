<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Un verre, ce soir ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Nouvelles polices plus fun et amicales -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Nouvelle palette fraîche et amicale */
    --bg-page: #fff5f6; /* Blanc très légèrement rosé */
    --accent: #ff4d6d;  /* Corail/Rose vif */
    --accent-hover: #e03755;
    --text-main: #2b2d42; /* Bleu/Gris très foncé */
    --text-muted: #8d99ae;
    --card-bg: rgba(255, 255, 255, 0.7);
    --card-border: rgba(255, 255, 255, 0.8);
    --glow: rgba(255, 77, 109, 0.25);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg-page);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  body{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  
  /* Taches de couleurs douces (bokeh) en fond */
  .bokeh{
    position:absolute; border-radius:50%;
    filter: blur(60px);
    pointer-events:none;
    z-index: -1;
  }
  .bokeh.b1{ width:300px; height:300px; background:#ffb3c1; top:0%; left:5%; opacity:0.6;}
  .bokeh.b2{ width:250px; height:250px; background:#a2d2ff; bottom:5%; right:5%; opacity:0.5;}
  .bokeh.b3{ width:200px; height:200px; background:#ffc8dd; bottom:20%; left:15%; opacity:0.5;}

  .stage{
    position:relative;
    width:min(92vw, 560px);
    min-height:520px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* Nouvelle carte style Glassmorphism */
  .card{
    position:relative;
    width:100%;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1.5px solid var(--card-border);
    border-radius: 32px;
    box-shadow: 0 20px 40px rgba(43, 45, 66, 0.05);
    text-align:center;
    padding: 40px 24px;
  }

  .eyebrow{
    font-size:13px;
    font-weight: 600;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--accent);
    opacity:0.9;
    margin-bottom:16px;
  }

  h1{
    font-family:'Outfit', sans-serif;
    font-weight:700;
    font-size:clamp(28px, 5vw, 40px);
    line-height:1.2;
    margin:0 0 42px 0;
    color:var(--text-main);
  }
  
  /* Soulignement style surligneur sympa */
  h1 em{
    font-style:normal;
    position: relative;
    display: inline-block;
    z-index: 1;
  }
  h1 em::after{
    content: '';
    position: absolute;
    bottom: 4px; left: -2%;
    width: 104%; height: 12px;
    background: #ffb3c1;
    z-index: -1;
    border-radius: 4px;
    opacity: 0.6;
    transform: rotate(-1deg);
  }

  .choice-zone{
    position:relative;
    width:100%;
    height:150px;
  }

  .btn{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    border:none;
    border-radius:999px;
    padding:16px 40px;
    font-family:'Outfit', sans-serif;
    font-weight:600;
    font-size:18px;
    cursor:pointer;
    transition: top 0.35s cubic-bezier(.2,.9,.3,1.3), left 0.35s cubic-bezier(.2,.9,.3,1.3), transform 0.35s cubic-bezier(.2,.9,.3,1.3), box-shadow 0.25s ease, background 0.2s ease;
  }

  #btnOui{
    background: var(--accent);
    color: white;
    box-shadow: 0 8px 24px var(--glow);
    top:0;
    z-index: 10;
  }
  #btnOui:hover{
    background: var(--accent-hover);
    box-shadow: 0 10px 30px rgba(255, 77, 109, 0.4);
    transform:translateX(-50%) translateY(-2px);
  }

  #btnNon{
    background: white;
    color: var(--text-muted);
    border: 2px solid #edf2f4;
    top:66px;
    z-index: 5;
  }

  /* ---- Panels ---- */
  .panel{
    display:none;
    width:100%;
    animation: rise 0.5s cubic-bezier(.2,.8,.2,1);
  }
  .panel.active{ display:block; }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .panel h2{
    font-family:'Outfit', sans-serif;
    font-weight:700;
    font-size:26px;
    margin: 0 0 22px 0;
    color:var(--text-main);
  }

  .cal-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .cal-header button{
    background:none; border:none; color:var(--text-main);
    font-size:22px; cursor:pointer; padding:4px 12px;
    border-radius:8px;
    transition: background 0.2s;
  }
  .cal-header button:hover{ background: rgba(0,0,0,0.04); }
  .cal-month{ font-family:'Outfit', sans-serif; font-weight:600; font-size:18px; }

  .cal-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:6px;
    margin-bottom:10px;
  }
  .cal-dow{
    font-size:12px; font-weight:600; color:var(--text-muted); text-align:center; padding-bottom:4px;
    text-transform:uppercase; letter-spacing:0.05em;
  }
  .cal-day{
    aspect-ratio:1;
    display:flex; align-items:center; justify-content:center;
    border-radius:12px;
    font-size:15px; font-weight:500;
    cursor:pointer;
    color:var(--text-main);
    background: rgba(255,255,255,0.5);
    border: 1px solid transparent;
    transition: all 0.2s ease;
  }
  .cal-day.disabled{
    color: #d8e2dc;
    cursor:default;
    background:transparent;
  }
  .cal-day.empty{ visibility:hidden; }
  .cal-day:not(.disabled):not(.empty):hover{
    background: white;
    border-color: #ffe5ec;
    transform:translateY(-1px);
  }
  .cal-day.selected{
    background: var(--accent);
    color:white;
    font-weight:600;
    border-color: var(--accent);
    box-shadow: 0 4px 12px var(--glow);
    transform:scale(1.05);
  }

  .time-row{
    display:flex; gap:8px; flex-wrap:wrap;
    justify-content:center;
    margin: 20px 0 28px 0;
  }
  .time-chip{
    padding:10px 18px;
    border-radius:999px;
    border:2px solid #edf2f4;
    background:white;
    color:var(--text-main);
    font-size:14px; font-weight:500;
    cursor:pointer;
    transition: all 0.2s ease;
  }
  .time-chip:hover{ border-color:var(--accent-hover); color:var(--accent); }
  .time-chip.selected{
    background: var(--accent);
    color:white;
    border-color: var(--accent);
    font-weight:600;
    box-shadow: 0 4px 12px var(--glow);
  }

  .confirm-btn{
    width:100%;
    border:none;
    border-radius:999px;
    padding:16px;
    font-family:'Outfit', sans-serif;
    font-weight:600;
    font-size:16px;
    color:white;
    background: var(--accent);
    cursor:pointer;
    box-shadow: 0 8px 24px var(--glow);
    transition: all 0.2s ease;
  }
  .confirm-btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
    box-shadow:none;
  }
  .confirm-btn:not(:disabled):hover{ 
    transform:translateY(-2px); 
    background: var(--accent-hover);
  }

  .success{
    text-align:center;
  }
  .success .glass{
    font-size:52px;
    margin-bottom:12px;
    display:block;
  }
  .success p{
    color:var(--text-muted);
    font-size:15px;
    line-height:1.6;
  }
  .success .recap{
    color:var(--accent);
    font-weight:600;
  }

  .status-msg{
    margin-top:14px;
    font-size:12px;
    color:var(--text-muted);
    min-height:16px;
  }

  @media (prefers-reduced-motion: reduce){
    .btn, .panel{ transition:none; animation:none; }
  }
</style>
</head>
<body>

<div class="bokeh b1"></div>
<div class="bokeh b2"></div>
<div class="bokeh b3"></div>

<div class="stage">
  <div class="card">

    <!-- Panel 1 : la question -->
    <div id="panelQuestion" class="panel active">
      <div class="eyebrow">Petite question ✌️</div>
      <h1>Est-ce que ça te dirait<br>qu'on aille <em>boire un verre</em> ?</h1>

      <div class="choice-zone" id="choiceZone">
        <button id="btnOui" class="btn">Grave !</button>
        <button id="btnNon" class="btn">Non</button>
      </div>

    </div>

    <!-- Panel 2 : calendrier -->
    <div id="panelCalendar" class="panel">
      <h2>Choisis un moment qui t'arrange</h2>

      <div class="cal-header">
        <button id="prevMonth" aria-label="Mois précédent">‹</button>
        <div class="cal-month" id="calMonthLabel"></div>
        <button id="nextMonth" aria-label="Mois suivant">›</button>
      </div>

      <div class="cal-grid" id="calDow"></div>
      <div class="cal-grid" id="calGrid"></div>

      <div class="time-row" id="timeRow">
        <button class="time-chip" data-time="18:00">18h00</button>
        <button class="time-chip" data-time="19:00">19h00</button>
        <button class="time-chip" data-time="20:00">20h00</button>
        <button class="time-chip" data-time="21:00">21h00</button>
      </div>

      <button class="confirm-btn" id="confirmBtn" disabled>Confirmer ça !</button>
      <div class="status-msg" id="statusMsg">&nbsp;</div>
    </div>

    <!-- Panel 3 : succès -->
    <div id="panelSuccess" class="panel">
      <div class="success">
        <span class="glass">🍹</span>
        <h2>C'est noté !</h2>
        <p>On se voit <span class="recap" id="recap"></span>.<br>À très vite !</p>
      </div>
    </div>

  </div>
</div>

<script>
  // ============================================================
  // URL de ton Cloudflare Worker
  // ============================================================
  const WORKER_URL = "https://invitation-webhook.nohan-brochard0-629.workers.dev/";

  // ---------- Bouton "Non" fuyant ----------
  const zone = document.getElementById('choiceZone');
  const btnNon = document.getElementById('btnNon');
  const btnOui = document.getElementById('btnOui');
  
  let compteurNon = 0;

  function fleeButton(){
    compteurNon++; 

    const zoneRect = zone.getBoundingClientRect();
    const btnRect = btnNon.getBoundingClientRect();
    const ouiRect = btnOui.getBoundingClientRect();

    const maxLeft = zoneRect.width - btnRect.width;
    const maxTop = zoneRect.height - btnRect.height;

    const padding = 15;
    const ouiLeft = (ouiRect.left - zoneRect.left) - padding;
    const ouiTop = (ouiRect.top - zoneRect.top) - padding;
    const ouiRight = (ouiRect.right - zoneRect.left) + padding;
    const ouiBottom = (ouiRect.bottom - zoneRect.top) + padding;

    let newLeft, newTop;
    let overlap = true;
    let attempts = 0;

    while (overlap && attempts < 100) {
      newLeft = Math.max(8, Math.min(maxLeft - 8, Math.random() * maxLeft));
      newTop = Math.max(0, Math.min(maxTop, Math.random() * maxTop));

      const nonRight = newLeft + btnRect.width;
      const nonBottom = newTop + btnRect.height;

      if (newLeft < ouiRight && nonRight > ouiLeft && newTop < ouiBottom && nonBottom > ouiTop) {
        overlap = true; 
      } else {
        overlap = false; 
      }
      attempts++;
    }

    btnNon.style.left = newLeft + 'px';
    btnNon.style.top = newTop + 'px';
    btnNon.style.transform = 'none';
  }

  zone.addEventListener('mousemove', (e) => {
    const btnRect = btnNon.getBoundingClientRect();
    const cx = btnRect.left + btnRect.width / 2;
    const cy = btnRect.top + btnRect.height / 2;
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    if (dist < 90) fleeButton();
  });

  btnNon.addEventListener('touchstart', (e) => {
    e.preventDefault();
    fleeButton();
  }, { passive: false });

  btnNon.addEventListener('click', (e) => {
    e.preventDefault();
    fleeButton();
  });

  // ---------- Passage au calendrier ----------
  const panelQuestion = document.getElementById('panelQuestion');
  const panelCalendar = document.getElementById('panelCalendar');
  const panelSuccess = document.getElementById('panelSuccess');

  btnOui.addEventListener('click', () => {
    panelQuestion.classList.remove('active');
    panelCalendar.classList.add('active');
    renderCalendar();
  });

  // ---------- Calendrier ----------
  const dowLabels = ['Lu','Ma','Me','Je','Ve','Sa','Di'];
  const monthLabels = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

  let today = new Date();
  today.setHours(0,0,0,0);
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let selectedDate = null;
  let selectedTime = null;

  const calDow = document.getElementById('calDow');
  const calGrid = document.getElementById('calGrid');
  const calMonthLabel = document.getElementById('calMonthLabel');
  const confirmBtn = document.getElementById('confirmBtn');
  const statusMsg = document.getElementById('statusMsg');

  dowLabels.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    calDow.appendChild(el);
  });

  function renderCalendar(){
    calMonthLabel.textContent = `${monthLabels[viewMonth]} ${viewYear}`;
    calGrid.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1);
    let startOffset = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for (let i = 0; i < startOffset; i++){
      const empty = document.createElement('div');
      empty.className = 'cal-day empty';
      calGrid.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++){
      const cell = document.createElement('div');
      const cellDate = new Date(viewYear, viewMonth, day);
      const isPast = cellDate < today;

      cell.className = 'cal-day' + (isPast ? ' disabled' : '');
      cell.textContent = day;

      if (!isPast){
        cell.addEventListener('click', () => {
          document.querySelectorAll('.cal-day.selected').forEach(el => el.classList.remove('selected'));
          cell.classList.add('selected');
          selectedDate = cellDate;
          updateConfirmState();
        });
      }

      if (selectedDate && cellDate.getTime() === selectedDate.getTime()){
        cell.classList.add('selected');
      }

      calGrid.appendChild(cell);
    }
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0){ viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11){ viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  document.querySelectorAll('.time-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.time-chip.selected').forEach(el => el.classList.remove('selected'));
      chip.classList.add('selected');
      selectedTime = chip.dataset.time;
      updateConfirmState();
    });
  });

  function updateConfirmState(){
    confirmBtn.disabled = !(selectedDate && selectedTime);
  }

  function formatDateFr(d){
    return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  confirmBtn.addEventListener('click', async () => {
    if (!selectedDate || !selectedTime) return;

    confirmBtn.disabled = true;
    statusMsg.textContent = 'Envoi en cours…';

    const dateLabel = formatDateFr(selectedDate);
    
    // Le message s'adapte aussi !
    let message = `🍹 Elle a dit **oui** ! Vous allez boire un verre le **${dateLabel}** à **${selectedTime}**.`;
    
    if (compteurNon > 0) {
      message += `\n\n*(PS : Elle a quand même essayé de cliquer sur "Non" **${compteurNon}** fois avant d'accepter... 🤭)*`;
    }

    if (!WORKER_URL || WORKER_URL.includes('COLLE_ICI')) {
      statusMsg.textContent = "Worker non configuré.";
      confirmBtn.disabled = false;
      return;
    }

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: message })
      });

      if (!res.ok) throw new Error('Le serveur a répondu avec le statut ' + res.status);

      panelCalendar.classList.remove('active');
      panelSuccess.classList.add('active');
      document.getElementById('recap').textContent = `le ${dateLabel} à ${selectedTime}`;
    } catch (err) {
      statusMsg.textContent = "Erreur : " + err.message;
      confirmBtn.disabled = false;
    }
  });
</script>

</body>
</html>
